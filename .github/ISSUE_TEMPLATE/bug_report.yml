name: Bug report
description: 报告误报、漏报、安装或通知问题
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      options: [Chrome, Edge, Arc, Other Chromium]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: 扩展版本
      placeholder: 1.0.0
    validations: { required: true }
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤
    validations: { required: true }
  - type: textarea
    id: diagnostic
    attributes:
      label: 复制的诊断信息
      description: 请先删除不希望公开的信息；不要粘贴 Cookie 或登录令牌。
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: 检查项
      options:
        - label: 我已停用旧版用户脚本，避免重复运行
          required: true
        - label: 我没有在此 Issue 中包含 Cookie、令牌等敏感信息
          required: true
